site_name: OKOS
site_description: OK赛事联盟企业知识系统
site_url: ""
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: white
    accent: indigo

plugins:
  - search:
      lang:
        - zh
        - en
  - gen-files:
      scripts:
        - tools/generate_mkdocs_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Quick: Quick/index.md
  - Playbooks: Playbooks/index.md
  - Training: Training/index.md
  - Rules: Rules/index.md
  - Reports: Reports/index.md
  - Activity: Activity/index.md

extra:
  generator: false

